name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"
      - "py-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release. Empty = v{pyproject version}"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-vaidcord-py-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  test:
    name: Test vaidcord-py before release
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.pytest.outputs.passed }}
    defaults:
      run:
        working-directory: vaidcord-py
    steps:
      - uses: actions/checkout@v6

      - name: Install media libraries (ffmpeg, libopus)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev --extra voice

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Tests (pytest)
        id: pytest
        run: |
          uv run python -m pytest -q | tee pytest.log
          PASSED=$(grep -Eo '[0-9]+ passed' pytest.log | tail -1 | grep -Eo '[0-9]+' || echo 0)
          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, release and publish vaidcord-py
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: pypi
      url: https://pypi.org/p/vaidcord/ # Notice vaidcord-py is published as "vaidcord" on PyPI

    permissions:
      contents: write      # create/update GitHub Release + push release card
      id-token: write      # PyPI Trusted Publishing / OIDC

    defaults:
      run:
        working-directory: vaidcord-py

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vaidcord-py/pyproject.toml

      - name: Validate release tag matches package version
        id: meta
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          event_name = os.environ["GITHUB_EVENT_NAME"]
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          dispatch_tag = os.environ.get("DISPATCH_TAG", "").strip()

          if event_name == "workflow_dispatch":
              tag = dispatch_tag or f"v{version}"
          else:
              tag = ref_name

          accepted = {f"v{version}", f"py-v{version}", version}
          if tag not in accepted:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject version {version!r}. "
                  f"Use one of: {', '.join(sorted(accepted))}"
              )

          prerelease = bool(re.search(r"(a|b|rc|dev)\d*$", version))

          def out(name: str, value: str) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{name}={value}\n")

          out("version", version)
          out("tag", tag)
          out("prerelease", str(prerelease).lower())
          PY
        env:
          DISPATCH_TAG: ${{ inputs.tag }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: |
          python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*

      - name: Resolve git reference for history
        id: ref
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch before the tag exists: use the built commit.
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release card
        working-directory: .
        run: |
          REF='${{ steps.ref.outputs.ref }}'
          PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || echo "")
          RANGE="$REF"
          [ -n "$PREV" ] && RANGE="${PREV}..${REF}"
          COMMITS=$(git log --no-merges --oneline "$RANGE" -- vaidcord-py | wc -l | tr -d ' ')
          ARGS=()
          if [ -f vaidcord-py/.release-highlights ]; then
            while IFS= read -r line && [ "${#ARGS[@]}" -lt 8 ]; do
              [ -n "$line" ] && ARGS+=(--highlight "$line")
            done < vaidcord-py/.release-highlights
          fi
          python .github/scripts/release_card.py \
            --package vaidcord --version "${{ steps.meta.outputs.version }}" \
            --language Python --tag "${{ steps.meta.outputs.tag }}" \
            --stat "${{ needs.test.outputs.passed }}=tests passing" \
            --stat "${COMMITS}=commits in release" \
            --stat "3=cipher modes" \
            --stat "v10=API coverage" \
            "${ARGS[@]}" \
            --out release-card.svg

      - name: Publish release card
        id: card
        working-directory: .
        run: bash .github/scripts/publish_card.sh release-card.svg "${{ steps.meta.outputs.tag }}"

      - name: Generate release notes
        working-directory: .
        run: |
          ARGS=()
          if [ -f vaidcord-py/.release-highlights ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && ARGS+=(--highlight "$line")
            done < vaidcord-py/.release-highlights
          fi
          python .github/scripts/release_notes.py \
            --package vaidcord --version "${{ steps.meta.outputs.version }}" \
            --tag "${{ steps.ref.outputs.ref }}" --language python \
            --tag-pattern "v*" --tag-pattern "py-v*" --path vaidcord-py --path UNITED.md \
            --card-url "${{ steps.card.outputs.card-url }}" \
            "${ARGS[@]}" \
            --out release-notes.md

      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FLAGS=()
          [ "${{ steps.meta.outputs.prerelease }}" = "true" ] && FLAGS+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "VAIDCORD-PY ${{ steps.meta.outputs.version }}" --notes-file release-notes.md "${FLAGS[@]}"
            gh release upload "$TAG" vaidcord-py/dist/* release-card.svg --clobber
          else
            # --target creates the tag when it does not exist yet (dispatch mode).
            gh release create "$TAG" vaidcord-py/dist/* release-card.svg \
              --title "VAIDCORD-PY ${{ steps.meta.outputs.version }}" \
              --notes-file release-notes.md --target "${GITHUB_SHA}" "${FLAGS[@]}"
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: vaidcord-py/dist
          skip-existing: true
