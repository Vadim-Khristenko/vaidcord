name: Publish Go module

on:
  push:
    tags:
      - "vaidcord-go/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (vaidcord-go/vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-vaidcord-go-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  test:
    name: Test vaidcord-go before release
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.count.outputs.passed }}
    defaults:
      run:
        working-directory: vaidcord-go
    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-go@v5
        with:
          go-version-file: vaidcord-go/go.mod
          cache-dependency-path: vaidcord-go/go.sum

      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need gofmt:"; echo "$UNFORMATTED"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests (race detector)
        id: count
        run: |
          go test -race -v ./... 2>&1 | tee test.log
          PASSED=$(grep -c '^=== RUN   Test' test.log || echo 0)
          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"

  release:
    name: Release vaidcord-go
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write   # create GitHub Release + push release card

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            vaidcord-go/v*) ;;
            *) echo "Tag ${TAG} must look like vaidcord-go/vX.Y.Z" >&2; exit 1 ;;
          esac
          VERSION="${TAG#vaidcord-go/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve git reference for history
        id: ref
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release card
        run: |
          REF='${{ steps.ref.outputs.ref }}'
          PREV=$(git tag --list 'vaidcord-go/v*' --sort=-creatordate --merged "${REF}^" 2>/dev/null | grep -v "^${{ steps.meta.outputs.tag }}$" | head -1 || echo "")
          RANGE="$REF"
          [ -n "$PREV" ] && RANGE="${PREV}..${REF}"
          COMMITS=$(git log --no-merges --oneline "$RANGE" -- vaidcord-go | wc -l | tr -d ' ')
          ARGS=()
          if [ -f vaidcord-go/.release-highlights ]; then
            while IFS= read -r line && [ "${#ARGS[@]}" -lt 8 ]; do
              [ -n "$line" ] && ARGS+=(--highlight "$line")
            done < vaidcord-go/.release-highlights
          fi
          python3 .github/scripts/release_card.py \
            --package vaidcord-go --version "${{ steps.meta.outputs.version }}" \
            --language Go --tag "${{ steps.meta.outputs.tag }}" \
            --stat "${{ needs.test.outputs.passed }}=tests passing" \
            --stat "${COMMITS}=commits in release" \
            --stat "3=cipher modes" \
            --stat "race=detector clean" \
            "${ARGS[@]}" \
            --out release-card.svg

      - name: Publish release card
        id: card
        run: bash .github/scripts/publish_card.sh release-card.svg "${{ steps.meta.outputs.tag }}"

      - name: Generate release notes
        run: |
          ARGS=()
          if [ -f vaidcord-go/.release-highlights ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && ARGS+=(--highlight "$line")
            done < vaidcord-go/.release-highlights
          fi
          python3 .github/scripts/release_notes.py \
            --package vaidcord-go --version "${{ steps.meta.outputs.version }}" \
            --tag "${{ steps.ref.outputs.ref }}" --language go \
            --tag-pattern "vaidcord-go/v*" --path vaidcord-go --path UNITED.md \
            --card-url "${{ steps.card.outputs.card-url }}" \
            "${ARGS[@]}" \
            --out release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "VAIDCORD-GO ${{ steps.meta.outputs.version }}" --notes-file release-notes.md
            gh release upload "$TAG" release-card.svg --clobber
          else
            # --target creates the tag when it does not exist yet (dispatch mode).
            gh release create "$TAG" release-card.svg \
              --title "VAIDCORD-GO ${{ steps.meta.outputs.version }}" \
              --notes-file release-notes.md --target "${GITHUB_SHA}"
          fi

      - name: Request Go module proxy indexing
        run: |
          MODULE="github.com/!vadim-!khristenko/vaidcord/vaidcord-go"
          VERSION="v${{ steps.meta.outputs.version }}"
          for attempt in $(seq 1 10); do
            if curl -sf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info"; then
              echo
              echo "proxy.golang.org indexed ${VERSION}"
              exit 0
            fi
            echo "waiting for proxy.golang.org (attempt ${attempt})..."
            sleep 20
          done
          echo "proxy.golang.org did not index the module yet; it will index on first go-get." >&2
