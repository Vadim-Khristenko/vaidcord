[package]
name = "vaidcord"
version = "0.1.0"
edition = "2024"
description = "Early Rust SDK scaffold for VaidCord"
license = "MIT"
repository = "https://github.com/Vadim-Khristenko/vaidcord"

[lib]
name = "vaidcord"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
