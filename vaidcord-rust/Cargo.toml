[package]
name = "vaidcord"
version = "0.1.0"
edition = "2024"
description = "Early Rust SDK scaffold for VaidCord"
license = "MIT"
repository = "https://github.com/Vadim-Khristenko/vaidcord"

[lib]
name = "vaidcord"
path = "src/lib.rs"

[dependencies]
vaidcord-macros = { version = "0.1.0", path = "macros" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
