[package]
name = "vaidcord-macros"
version = "0.2.0"
edition = "2024"
description = "Procedural macros for the VaidCord Rust SDK"
license = "MIT"
repository = "https://github.com/Vadim-Khristenko/vaidcord"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

