[project]
name = "vaidcord"
version = "0.1.0"
description = "High-performance Discord framework inspired by Aiogram 3.x architecture"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "pytest-cov>=7.1.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "wemake-python-styleguide>=0.19.2",
    "flake8>=7.1.1",
    "mypy>=1.11.2",
]
fsm-backends = [
    "redis>=5.0.0",
    "asyncpg>=0.30.0",
]
mongo = [
    "pymongo>=4.9.0",
]
redis = [
    "redis>=5.0.0",
]
postgres = [
    "asyncpg>=0.30.0",
]
all-backends = [
    "redis>=5.0.0",
    "pymongo>=4.9.0",
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaidcord"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
]
ignore = ["E501"]  # Ignore line length for now

[tool.ruff.lint.isort]
known-first-party = ["vaidcord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "flake8>=7.1.1",
    "wemake-python-styleguide>=0.19.2",
    "mypy>=1.11.2",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["WPS111", "WPS110", "WPS226"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
