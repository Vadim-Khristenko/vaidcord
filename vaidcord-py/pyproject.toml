[project]
name = "vaidcord"
version = "0.1.0b1"
description = "High-performance Discord framework inspired by Aiogram 3.x architecture"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "VaidCord Team" },
]
maintainers = [
    { name = "VaidCord Team" },
]
keywords = ["discord", "bot", "gateway", "fsm", "asyncio", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "typing-extensions>=4.10.0",
]

[project.urls]
Homepage = "https://github.com/Vadim-Khristenko/vaidcord"
Repository = "https://github.com/Vadim-Khristenko/vaidcord"
Issues = "https://github.com/Vadim-Khristenko/vaidcord/issues"
Documentation = "https://github.com/Vadim-Khristenko/vaidcord/tree/main/vaidcord-py/docs"

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "wemake-python-styleguide>=0.19.2",
    "flake8>=7.1.1",
    "mypy>=1.11.2",
]
fsm-backends = [
    "redis>=5.0.0",
    "asyncpg>=0.30.0",
]
mongo = [
    "pymongo>=4.9.0",
]
redis = [
    "redis>=5.0.0",
]
postgres = [
    "asyncpg>=0.30.0",
]
all-backends = [
    "redis>=5.0.0",
    "pymongo>=4.9.0",
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaidcord"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # Ignore line length for now
    "E731",  # Legacy tests use compact lambda-based mocks.
    "F811",  # Legacy tests redefine simple mock helpers.
    "UP040", # Keep TypeAlias style until typing module is refactored.
    "UP042", # Keep str+Enum OAuth enums for compatibility.
    "UP046", # Keep Python 3.12-compatible Generic style in public ABCs.
]

[tool.ruff.lint.isort]
known-first-party = ["vaidcord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "flake8>=7.1.1",
    "wemake-python-styleguide>=0.19.2",
    "mypy>=1.11.2",
]

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E501",
    "WPS",
]

[tool.mypy]
python_version = "3.12"
ignore_errors = true
ignore_missing_imports = true
strict = false
warn_unused_ignores = false
warn_redundant_casts = false
warn_unreachable = false

[[tool.mypy.overrides]]
module = [
    "vaidcord.api_client",
    "vaidcord.bot",
    "vaidcord.http",
    "vaidcord.logging",
]
ignore_errors = false
disallow_untyped_defs = true
warn_return_any = true
